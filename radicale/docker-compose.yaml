# Can be enhanced with an additional compose file
# See also https://docs.docker.com/compose/production/#modify-your-compose-file-for-production

services:
  radicale:
    image: tomsquest/docker-radicale@sha256:32cb0774057a960ffd01c6ab66a0dc9de30faad2de72b3e57990d659c870ef44
    container_name: radicale
    ports:
      - 5232:5232
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - KILL
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 50
    healthcheck:
      test: curl -f http://127.0.0.1:5232 || exit 1
      interval: 30s
      retries: 3
    restart: unless-stopped
    volumes:
      - ${docker_volume_path}/radicale/data/config:/etc/radicale/config:ro
      - ${docker_volume_path}/radicale/data/users:/etc/radicale/users:ro
      - ${docker_volume_path}/radicale/data/collections:/etc/radicale/collections:rw