services:
  vaultwarden:
    image: vaultwarden/server:latest-alpine
    container_name: vaultwarden
    restart: unless-stopped
    networks:
      - vaultwarden
    environment:
      DOMAIN: "https://mdp.${public_domain_name}"
    volumes:
      - ./vw-data/:/data/
    ports:
      - 127.0.0.1:${vaultwarden_external_port}:80
    labels:
      - traefik.enable=true
      - traefik.http.routers.vaultwarden.rule=Host(`vault.${public_domain_name}`) || Host(`mdp.${public_domain_name}`)
      - traefik.http.routers.vaultwarden.entrypoints=websecure
networks:
  vaultwarden:
    name: vaultwarden
    driver: bridge
    external: true
